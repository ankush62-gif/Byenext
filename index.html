id="adminBtn" style="display:none" onclick="show('admin')">Admin</button>
<header><div class="logo">Byenext</div><nav><button onclick="show('shop')">Shop</button><button onclick="show('orders')">My Orders</button><button onclick="show('admin')">Admin</button><button onclick="logout()">Logout</button></nav></header>
<main><section id="shop"><h1>Shop with Byenext</h1><p class="muted">Simple online ordering platform</p><div id="products" class="grid"></div></section>
<section id="orders" class="hidden"><h2>My Orders</h2><div id="orderList"></div></section>
<section id="admin" class="hidden"><h2>Admin Panel</h2><div id="adminBox"></div></section></main>
<div id="cart" class="cart"><h3>Cart</h3><div id="cartItems"></div><b>Total: ₹<span id="total">0</span></b><input id="address" placeholder="Delivery address"><button onclick="checkout()">Place Order</button></div>
<div id="login" class="modal"><div class="card"><h2>Byenext Login</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Name (for signup)"><button onclick="login()">Login</button><button class="secondary" onclick="signup()">Create account</button><p id="msg"></p><small>Demo admin: admin@byenext.com / Admin@123</small></div></div>
<script>
let token=localStorage.token,role=localStorage.role,cart=[];
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};if(opt.body)opt.headers["Content-Type"]="application/json";let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}
function show(id){["shop","orders","admin"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="orders")loadOrders();if(id==="admin")loadAdmin()}
async function load(){let ps=await api("/api/products");$("products").innerHTML=ps.map(p=>`<div class="product"><img src="${p.image}"><h3>${p.name}</h3><p>${p.description}</p><b>₹${p.price}</b><button onclick='add(${p.id})'>Add to cart</button></div>`).join("")}
async function add(id){let ps=await api("/api/products"),p=ps.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({id,qty:1,name:p.name,price:p.price});renderCart()}
function renderCart(){$("cartItems").innerHTML=cart.map(x=>`<div class=item>${x.name} × ${x.qty}<b>₹${x.price*x.qty}</b></div>`).join("");$("total").textContent=cart.reduce((s,x)=>s+x.price*x.qty,0)}
async function checkout(){if(!cart.length)return alert("Cart is empty");try{let d=await api("/api/orders",{method:"POST",body:JSON.stringify({items:cart,address:$("address").value})});alert(`Order #${d.orderId} placed. 1% service fee: ₹${d.serviceFee}`);cart=[];renderCart();show("orders")}catch(e){alert(e.message)}}
async function login(){try{let d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("password").value})});token=d.token;localStorage.token=token;$("login").classList.add("hidden");load()}catch(e){$("msg").textContent=e.message}}
async function signup(){try{let d=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("name").value,email:$("email").value,password:$("password").value})});token=d.token;localStorage.token=token;$("login").classList.add("hidden");load()}catch(e){$("msg").textContent=e.message}}
function logout(){localStorage.removeItem("token");token=null;location.reload()}
async function loadOrders(){try{let os=await api("/api/orders");$("orderList").innerHTML=os.length?os.map(o=>`<div class=order><b>Order #${o.id}</b><br>Total ₹${o.total}<br>Status: <b>${o.status}</b><br>${o.address}</div>`).join(""):"No orders yet"}catch(e){$("orderList").textContent=e.message}}
async function loadAdmin(){try{let os=await api("/api/orders"),ps=await api("/api/products");$("adminBox").innerHTML=`<div class=adminbox><h3>Orders (${os.length})</h3>${os.map(o=>`<div class=order>#${o.id} — ₹${o.total} — ${o.status} <select onchange="status(${o.id},this.value)"><option>Pending</option><option>Confirmed</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>`).join("")}<h3>Add product</h3><input id=n placeholder=Name><input id=pr type=number placeholder=Price><input id=im placeholder="Image URL"><input id=st type=number placeholder=Stock><button onclick=addProduct()>Add Product</button><h3>Products</h3>${ps.map(p=>`<div class=item>${p.name} ₹${p.price}<button onclick="del(${p.id})">Delete</button></div>`).join("")}</div>`}catch(e){$("adminBox").textContent="Admin login required"}}
async function status(id,s){await api("/api/orders/"+id,{method:"PUT",body:JSON.stringify({status:s})});loadAdmin()}
async function addProduct(){await api("/api/products",{method:"POST",body:JSON.stringify({name:$("n").value,price:+$("pr").value,image:$("im").value,description:"Byenext product",stock:+$("st").value})});loadAdmin();load()}
async function del(id){await api("/api/products/"+id,{method:"DELETE"});loadAdmin();load()}
if(token){try{role=JSON.parse(atob(token.split('.')[1])).role}catch(e){}$("adminBtn").style.display=role==="admin"?"inline-block":"none";$("login").classList.add("hidden");load()}else{$("login").classList.remove("hidden");}
</script></body></html>
