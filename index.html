<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byenext</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#111827;color:#111}
.box{max-width:1000px;margin:30px auto;padding:20px}.card{background:white;padding:22px;border-radius:16px;margin:15px 0}
.login{max-width:400px;margin:60px auto;text-align:center}.logo{font-size:45px;font-weight:bold;color:#635bff}
input,textarea{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:9px}
button{padding:12px 18px;margin:5px;border:0;border-radius:9px;background:#635bff;color:white;font-weight:bold}
.gray{background:#ddd;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.product img{width:100%;height:160px;object-fit:cover;border-radius:10px}.price{font-size:20px;font-weight:bold;color:#635bff}
.hide{display:none}.msg{margin:10px;padding:10px;background:#eee;border-radius:8px}
</style>
</head>
<body>

<div id="login" class="box">
<div class="card login">
<div class="logo">B</div>
<h1>Byenext</h1>
<p>Welcome to Byenext</p>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="gray" onclick="signupBox()">Create Account</button>
<div id="msg" class="msg"></div>
</div>
</div>

<div id="signup" class="box hide">
<div class="card login">
<h2>Create Account</h2>
<input id="name" placeholder="Name">
<input id="semail" placeholder="Email">
<input id="spass" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button class="gray" onclick="back()">Back</button>
<div id="smsg" class="msg"></div>
</div>
</div>

<div id="app" class="box hide">
<div class="card">
<h2>🛍️ Byenext</h2>
<button onclick="home()">Shop</button>
<button onclick="orders()">My Orders</button>
<button onclick="cartPage()">🛒 Cart <span id="count">0</span></button>
<button onclick="logout()">Logout</button>
</div>
<div id="content"></div>
</div>

<script>
let token=localStorage.getItem("token");
let products=[],cart=[],user=null;

async function api(url,opt={}){
 opt.headers={"Content-Type":"application/json",...(opt.headers||{})};
 if(token)opt.headers.Authorization="Bearer "+token;
 let r=await fetch(url,opt),d=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(d.error||"Request failed");
 return d;
}

function signupBox(){
 document.getElementById("login").classList.add("hide");
 document.getElementById("signup").classList.remove("hide");
}
function back(){
 document.getElementById("signup").classList.add("hide");
 document.getElementById("login").classList.remove("hide");
}

async function login(){
 try{
  let d=await api("/api/login",{method:"POST",body:JSON.stringify({
   email:email.value,password:pass.value
  })});
  token=d.token;user=d.user;localStorage.setItem("token",token);
  openApp();
 }catch(e){msg.textContent=e.message}
}

async function signup(){
 try{
  let d=await api("/api/register",{method:"POST",body:JSON.stringify({
   name:name.value,email:semail.value,password:spass.value
  })});
  token=d.token;user=d.user;localStorage.setItem("token",token);
  openApp();
 }catch(e){smsg.textContent=e.message}
}

async function openApp(){
 login.classList.add("hide");signup.classList.add("hide");
 app.classList.remove("hide");await load();home();
}

async function load(){products=await api("/api/products")}

function home(){
 let h='<div class="card"><h2>Products</h2><div class="grid">';
 products.forEach(p=>{
 h+=`<div class="card product">
 <img src="${p.image||""}" onerror="this.style.display='none'">
 <h3>${p.name}</h3><p>${p.description||""}</p>
 <div class="price">₹${p.price}</div>
 <button onclick="add(${p.id})">Add to Cart</button>
 </div>`;
 });
 h+='</div></div>';content.innerHTML=h;
}

function add(id){
 let x=cart.find(a=>a.id==id);
 if(x)x.qty++;else cart.push({id:id,qty:1});
 count.textContent=cart.reduce((a,b)=>a+b.qty,0);
 alert("Added to cart");
}

function cartPage(){
 let total=0,h='<div class="card"><h2>🛒 Cart</h2>';
 cart.forEach(x=>{
  let p=products.find(a=>a.id==x.id);
  total+=p.price*x.qty;
  h+=`<div class="msg">${p.name} × ${x.qty} = ₹${p.price*x.qty}</div>`;
 });
 let fee=total*.01;
 h+=`<h3>Subtotal: ₹${total}</h3>
 <p>Service fee 1%: ₹${fee.toFixed(2)}</p>
 <h2>Total: ₹${(total+fee).toFixed(2)}</h2>
 <textarea id="address" placeholder="Delivery address"></textarea>
 <button onclick="order()">Place Order</button></div>`;
 content.innerHTML=h;
}

async function order(){
 try{
  let d=await api("/api/orders",{method:"POST",body:JSON.stringify({
   items:cart,address:address.value
  })});
  alert("Order #"+d.orderId+" created");
  cart=[];count.textContent=0;orders();
 }catch(e){alert(e.message)}
}

async function orders(){
 try{
  let a=await api("/api/orders"),h='<div class="card"><h2>My Orders</h2>';
  a.forEach(o=>h+=`<div class="card"><b>Order #${o.id}</b>
  <p>Status: ${o.status}</p><p>Total: ₹${o.total}</p></div>`);
  h+='</div>';content.innerHTML=h;
 }catch(e){alert(e.message)}
}

function logout(){
 localStorage.removeItem("token");token=null;
 app.classList.add("hide");login.classList.remove("hide");
}
if(token)openApp().catch(logout);
</script>
</body>
</html>
