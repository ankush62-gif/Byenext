<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Byenext</title>
<link rel="stylesheet" href="/style.css">
</head>

<body>

<header>
<div class="logo">Byenext</div>

<nav>
<button onclick="show('shop')">Shop</button>
<button onclick="show('orders')">My Orders</button>
<button id="adminBtn" style="display:none" onclick="show('admin')">Admin</button>
<button onclick="logout()">Logout</button>
</nav>
</header>

<main>

<section id="shop">
<h1>Shop with Byenext</h1>
<p class="muted">Simple online ordering platform</p>
<div id="products" class="grid"></div>
</section>

<section id="orders" class="hidden">
<h2>My Orders</h2>
<div id="orderList"></div>
</section>

<section id="admin" class="hidden">
<h2>Admin Panel</h2>
<div id="adminBox"></div>
</section>

</main>

<div id="cart" class="cart">
<h3>Cart</h3>

<div id="cartItems"></div>

<b>Total: ₹<span id="total">0</span></b>

<input id="address" placeholder="Delivery address">

<button onclick="checkout()">Place Order</button>
</div>

<div id="login" class="modal">

<div class="card">

<h2>Byenext Login</h2>

<input id="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<input id="name" placeholder="Name (for signup)">

<button onclick="login()">Login</button>

<button class="secondary" onclick="signup()">Create account</button>

<p id="msg"></p>

<small>
Demo admin: admin@byenext.com / Admin@123
</small>

</div>

</div>


<script>

let token = localStorage.getItem("token");
let role = localStorage.getItem("role");
let cart = [];

const $ = id => document.getElementById(id);


async function api(url,opt={}){

opt.headers={
...(opt.headers||{}),
...(token ? {Authorization:"Bearer "+token} : {})
};

if(opt.body){
opt.headers["Content-Type"]="application/json";
}

let r=await fetch(url,opt);
let d=await r.json();

if(!r.ok){
throw Error(d.error || "Something went wrong");
}

return d;
}


function show(id){

if(id==="admin" && role!=="admin"){
alert("Admin login required");
return;
}

["shop","orders","admin"].forEach(x=>{
$(x).classList.toggle("hidden",x!==id);
});

if(id==="orders"){
loadOrders();
}

if(id==="admin"){
loadAdmin();
}

}


async function load(){

try{

let ps=await api("/api/products");

$("products").innerHTML=ps.map(p=>`

<div class="product">

<img src="${p.image || ""}">

<h3>${p.name}</h3>

<p>${p.description || ""}</p>

<b>₹${p.price}</b>

<button onclick="add(${p.id})">
Add to cart
</button>

</div>

`).join("");

}catch(e){

console.error(e);

}

}


async function add(id){

let ps=await api("/api/products");

let p=ps.find(x=>x.id===id);

if(!p){
alert("Product not found");
return;
}

let x=cart.find(x=>x.id===id);

if(x){
x.qty++;
}else{

cart.push({
id:p.id,
qty:1,
name:p.name,
price:p.price
});

}

renderCart();

}


function renderCart(){

$("cartItems").innerHTML=cart.map(x=>`

<div class="item">
${x.name} × ${x.qty}
<b>₹${x.price*x.qty}</b>
</div>

`).join("");

$("total").textContent=
cart.reduce((s,x)=>s+(x.price*x.qty),0);

}


async function checkout(){

if(!token){
alert("Please login first");
return;
}

if(!cart.length){
alert("Cart is empty");
return;
}

try{

let d=await api("/api/orders",{
method:"POST",
body:JSON.stringify({
items:cart,
address:$("address").value
})
});

alert(
"Order #"+d.orderId+
" placed successfully."
);

cart=[];

renderCart();

show("orders");

}catch(e){

alert(e.message);

}

}


async function login(){

$("msg").textContent="Logging in...";

try{

let d=await api("/api/login",{
method:"POST",
body:JSON.stringify({
email:$("email").value.trim(),
password:$("password").value
})
});

token=d.token;
role=d.user.role;

localStorage.setItem("token",token);
localStorage.setItem("role",role);

$("adminBtn").style.display=
role==="admin" ? "inline-block" : "none";

$("login").classList.add("hidden");

$("msg").textContent="";

await load();

}catch(e){

$("msg").textContent=e.message;

}

}


async function signup(){

$("msg").textContent="Creating account...";

try{

let d=await api("/api/register",{
method:"POST",
body:JSON.stringify({
name:$("name").value.trim(),
email:$("email").value.trim(),
password:$("password").value
})
});

token=d.token;
role=d.user.role;

localStorage.setItem("token",token);
localStorage.setItem("role",role);

$("adminBtn").style.display=
role==="admin" ? "inline-block" : "none";

$("login").classList.add("hidden");

$("msg").textContent="";

await load();

}catch(e){

$("msg").textContent=e.message;

}

}


function logout(){

localStorage.removeItem("token");
localStorage.removeItem("role");

token=null;
role=null;
cart=[];

location.reload();

}


async function loadOrders(){

try{

let os=await api("/api/orders");

$("orderList").innerHTML=os.length ?

os.map(o=>`

<div class="order">

<b>Order #${o.id}</b>

<br>

Total ₹${o.total}

<br>

Status:
<b>${o.status}</b>

<br>

${o.address || ""}

</div>

`).join("")

:

"No orders yet";

}catch(e){

$("orderList").textContent=e.message;

}

}


async function loadAdmin(){

if(role!=="admin"){

$("adminBox").textContent="Admin login required";

return;

}

try{

let os=await api("/api/orders");
let ps=await api("/api/products");

$("adminBox").innerHTML=`

<h3>Orders (${os.length})</h3>

${
os.length ?

os.map(o=>`

<div class="order">

<b>Order #${o.id}</b>

<br>

₹${o.total}

<br>

Status: ${o.status}

<select onchange="changeStatus(${o.id},this.value)">

<option value="Pending"
${o.status==="Pending"?"selected":""}>
Pending
</option>

<option value="Confirmed"
${o.status==="Confirmed"?"selected":""}>
Confirmed
</option>

<option value="Shipped"
${o.status==="Shipped"?"selected":""}>
Shipped
</option>

<option value="Delivered"
${o.status==="Delivered"?"selected":""}>
Delivered
</option>

<option value="Cancelled"
${o.status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

</div>

`).join("")

:

"No orders yet"
}


<h3>Add product</h3>

<input id="n" placeholder="Name">

<input id="pr" type="number" placeholder="Price">

<input id="im" placeholder="Image URL">

<input id="st" type="number" placeholder="Stock">

<button onclick="addProduct()">
Add Product
</button>


<h3>Products</h3>

${
ps.map(p=>`

<div class="item">

${p.name} ₹${p.price}

<button onclick="del(${p.id})">
Delete
</button>

</div>

`).join("")
}

`;

}catch(e){

$("adminBox").textContent=e.message;

}

}


async function changeStatus(id,status){

try{

await api("/api/orders/"+id,{
method:"PUT",
body:JSON.stringify({
status:status
})
});

loadAdmin();

}catch(e){

alert(e.message);

}

}


async function addProduct(){

try{

await api("/api/products",{
method:"POST",
body:JSON.stringify({

name:$("n").value,

price:Number($("pr").value),

image:$("im").value,

description:"Byenext product",

stock:Number($("st").value)

})
});

alert("Product added");

loadAdmin();
load();

}catch(e){

alert(e.message);

}

}


async function del(id){

try{

await api("/api/products/"+id,{
method:"DELETE"
});

loadAdmin();
load();

}catch(e){

alert(e.message);

}

}


if(token){

$("login").classList.add("hidden");

$("adminBtn").style.display=
role==="admin" ? "inline-block" : "none";

load();

}else{

$("login").classList.remove("hidden");

$("adminBtn").style.display="none";

}

renderCart();

</script>

</body>
</html>
